services:
  vibe:
    build:
      context: .
      dockerfile: Dockerfile
    image: kugoumusic-web
    container_name: kugoumusic-web
    restart: unless-stopped
    ports:
      - "28080:8080"
    environment:
      - PORT=8080
      - VIBE_GUID_FILE=/data/.device-guid
      - TZ=Asia/Shanghai
    volumes:
      - vibe-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  vibe-data:
